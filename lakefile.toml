name = "cozero_roots"
version = "0.1.0"
defaultTargets = ["CozeroCertificates"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "CozeroCertificates"
srcDir = "Lean"
roots = ["AlgebraBridge", "CozeroChains", "CutCardinality", "DivisorGrid", "GraphDefinition", "ResidueModel", "CozeroCertificates", "CozeroLocalZeros", "CozeroMahler", "CozeroRadial", "CozeroSeries", "GapExponents", "GraphRootBridge", "CozeroLimitTheorem", "RootSetTopology"]
